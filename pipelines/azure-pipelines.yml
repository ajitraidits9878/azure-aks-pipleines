trigger:
- main

variables:
  dockerRegistryServiceConnection: 'acr-service-connection'
  kubernetesServiceConnection: 'aks-service-connection'
  containerRegistry: 'myportfolioacr.azurecr.io' # Replace with actual ACR name

stages:
- stage: Build
  displayName: 'Build and Push Stage'
  jobs:
  - template: templates/build-template.yml
    parameters:
      serviceName: 'order-service'
      dockerfilePath: 'src/OrderService/Dockerfile'
  - template: templates/build-template.yml
    parameters:
      serviceName: 'product-service'
      dockerfilePath: 'src/ProductService/Dockerfile'
  - template: templates/build-template.yml
    parameters:
      serviceName: 'user-service'
      dockerfilePath: 'src/UserService/Dockerfile'
  - template: templates/build-template.yml
    parameters:
      serviceName: 'payment-service'
      dockerfilePath: 'src/PaymentService/Dockerfile'
  - template: templates/build-template.yml
    parameters:
      serviceName: 'notification-service'
      dockerfilePath: 'src/NotificationService/Dockerfile'

- stage: Deploy
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - template: templates/deploy-template.yml
    parameters:
      serviceName: 'order-service'
      manifestPath: 'k8s/order-service/deployment.yaml'
  - template: templates/deploy-template.yml
    parameters:
      serviceName: 'product-service'
      manifestPath: 'k8s/product-service/deployment.yaml'
  - template: templates/deploy-template.yml
    parameters:
      serviceName: 'user-service'
      manifestPath: 'k8s/user-service/deployment.yaml'
  - template: templates/deploy-template.yml
    parameters:
      serviceName: 'payment-service'
      manifestPath: 'k8s/payment-service/deployment.yaml'
  - template: templates/deploy-template.yml
    parameters:
      serviceName: 'notification-service'
      manifestPath: 'k8s/notification-service/deployment.yaml'
  - job: DeployIngress
    displayName: 'Deploy Ingress'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: KubernetesManifest@0
      inputs:
        action: 'deploy'
        kubernetesServiceConnection: '$(kubernetesServiceConnection)'
        manifests: 'k8s/ingress.yaml'
